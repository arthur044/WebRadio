# gitleaks (CI: `gitleaks detect --source . --redact -v`, v8.30.1, fetch-depth 0: varre TODAS as branches).
# A regra padrão continua ligada. As exceções abaixo são estreitas: cada uma exige caminho E valor (condition = "AND"),
# só vale para as regras listadas em targetRules (generic-api-key e curl-auth-user), e um segredo real no mesmo
# arquivo continua sendo detectado.
title = "WebRadio"

[extend]
useDefault = true

[[allowlists]]
description = "Fixtures de teste fabricadas (sem segredo real). Convenção: todo valor falso é 'segredo-de-teste-' + minúsculas, dígitos e hífen (até 40). Um valor com maiúscula ou '_' depois do prefixo NÃO é isentado: é o formato de uma credencial real colada."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^backend/tests/''']
regexes = ['''^segredo-de-teste-[a-z0-9-]{1,40}$''']

[[allowlists]]
description = "Placeholder do runbook de rotação de segredos (exemplo de comando; nao e credencial)."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^docs/runbooks/rotacao-de-segredos\.md$''']
regexes = ['''^aB-cD_123456789012345678$''']

[[allowlists]]
description = "teste.sh do Icecast: prova que a credencial PADRÃO (admin:hackme) é rejeitada com 401 (valor sabidamente falso, nunca usado)."
targetRules = ["curl-auth-user"]
condition = "AND"
paths = ['''^infra/icecast/teste\.sh$''']
regexes = ['''hackme''']
