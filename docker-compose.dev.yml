# =============================================================================
# WebRadio — docker-compose.dev.yml (E1-F16) · uso EXPLÍCITO, nunca override automático (S-M12):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --wait
#
# Só muda o que é de desenvolvimento: ambiente Development (seed da grade, scanner NoOp liberado) e portas
# de diagnóstico em 127.0.0.1 (1433, console do MinIO 9001, harbor-borda 8005). Segredos: os mesmos arquivos.
# O dev NÃO tem o Caddy (o `edge` fica no perfil `edge`, que ninguém liga aqui): o nginx do `web` publica a 8080 em HTTP, como sempre, e o host público vem de
# PUBLIC_HOST / PUBLIC_AUTHORITY / PUBLIC_ORIGIN do .env (a base de produção deriva tudo do DOMINIO, E5). O DOMINIO do .env ainda precisa existir (o compose
# interpola o arquivo inteiro); no dev vale `localhost`. Variáveis do `up`: SEED_DEV_DATA=true (seed de dev), RATE_LIMIT_GLOBAL=<n> (limite global de requisições por minuto e por IP da Api;
# padrão aqui 2000, o de produção é 600 e a Api de produção recusa subir com mais que isso).
# =============================================================================
x-dev-env: &dev-env
  ASPNETCORE_ENVIRONMENT: Development

services:
  # Sem Caddy no dev (E5-F02): a 8080 do web, em HTTP, é a entrada. Ligar o `edge` aqui exigiria um domínio e as portas 80/443 do computador.
  edge:
    profiles: [edge]

  # O host público do dev (E5): a base deriva do DOMINIO + https; aqui voltam as variáveis do .env com a porta e o http.
  web:
    environment:
      PUBLIC_HOST: "${PUBLIC_HOST:-localhost}"
      PUBLIC_AUTHORITY: "${PUBLIC_AUTHORITY:-localhost:8080}"
      # `$$scheme` vira o literal `$scheme` (o Compose escapa o cifrão): quem o resolve é o nginx, por requisição (sem Caddy, o esquema é o do próprio hop).
      PROTO_PUBLICO: "$$scheme"
      # Sem Caddy, quem fala com o nginx pela 8080 publicada chega pelo gateway da rede `edge` (172.30.250.1), que está DENTRO da EDGE_SUBNET da base: com a subnet de
      # produção aqui, um X-Forwarded-For forjado por quem acessa o dev valeria como IP do cliente. Só o loopback (o healthcheck) fica "confiável", e ele não manda o cabeçalho.
      EDGE_SUBNET: "127.0.0.1/32"
    ports:
      - "${WEB_PORT:-8080}:8080"

  icecast:
    environment:
      ICECAST_HOSTNAME: "${PUBLIC_HOST:-localhost}"

  sqlserver:
    environment:
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:1433:1433"
    networks: [dados, diag-sql]

  db-init:
    environment: *dev-env

  migrator:
    environment: *dev-env

  minio:
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_BROWSER: "on"
    ports:
      - "127.0.0.1:9001:9001"
    networks: [dados, playout, midia-borda, diag-minio]

  api:
    environment:
      <<: *dev-env
      Seguranca__PermitirScannerNoOp: "true"
      AllowedHosts: "${PUBLIC_HOST:-localhost};api;127.0.0.1"
      Storage__PublicEndpoint: "${PUBLIC_ORIGIN:-http://localhost:8080}/storage"
      # Seed de dev pelo DevDataSeeder, no boot da Api (E2-A03): locutores, uma semana de grade e 3 divulgações. Desligado por
      # padrão; ligue com SEED_DEV_DATA=true no `up`. A senha dos locutores vem do arquivo de segredo, nunca do YAML.
      Seed__DevData: "${SEED_DEV_DATA:-false}"
      Harbor__AtrasDoProxy: "true"
      # `conexao` da credencial de transmissão: o harbor-borda do dev está em 127.0.0.1:8005.
      Harbor__HostPublico: "localhost"
      Harbor__PortaPublica: "8005"
      # #146: o smoke e o E2E saem de um IP só (o do browser/runner) e passam dos 100/min do limite global (429 intermitente).
      # Só vale em Development: a API de produção recusa subir com esse valor acima de 100.
      RateLimit__LimiteGlobalPorMinuto: "${RATE_LIMIT_GLOBAL:-2000}"
    secrets:
      - { source: seed_dev_senha, target: Seed__DevSenha }

  worker:
    environment:
      DOTNET_ENVIRONMENT: Development
      Storage__PublicEndpoint: "${PUBLIC_ORIGIN:-http://localhost:8080}/storage"
      # E4-D8: o clamd (~1 GB) fica fora do `up` padrão do dev (perfil `antivirus`); sem ClamAv__Host o Worker usa o NoOp, só em Development (S-A02).
      Seguranca__PermitirScannerNoOp: "true"
      ClamAv__Host: ""

  # Para ligar o scanner real no dev: --profile antivirus e ClamAv__Host=clamd no worker.
  clamd:
    profiles: [antivirus]
  freshclam:
    profiles: [antivirus]

  # O ao vivo do dev entra pela borda, como em produção (E2-F11): a API vê o IP do proxy e roda com Harbor__AtrasDoProxy.
  # No dev a porta é só do loopback e o cliente chega pelo gateway do Docker, então a lista libera tudo.
  harbor-borda:
    environment:
      HARBOR_PERMITIDOS: "${HARBOR_PERMITIDOS:-0.0.0.0/0}"
      # Só o dev tem permissão para a lista aberta (o entrypoint do harbor-borda a recusa sem isto).
      HARBOR_LIBERAR_TUDO: "1"
    ports:
      - "127.0.0.1:8005:8005"

# Porta publicada não funciona em rede "internal". Cada serviço com porta de diagnóstico ganha uma rede SÓ
# sua (nunca uma compartilhada). O harbor-borda não precisa: ele já está na borda.
networks:
  diag-sql: {}
  diag-minio: {}
