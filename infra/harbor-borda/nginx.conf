# =============================================================================
# WebRadio — infra/harbor-borda/nginx.conf (E2-F11, Sentinel no PR #38)
# Borda do ao vivo: TCP puro (módulo stream) do source client do locutor até o liquidsoap:8005, que fica SÓ na rede playout.
# É o ÚNICO ponto que vê o IP real do cliente: o Liquidsoap e a API só veem o IP deste proxy (por isso a API roda com
# Harbor__AtrasDoProxy=true; o limite de conexões simultâneas por IP é daqui, o de taxa de tentativas não existe: risco aceito 3 do 05 §4). O allow/deny vem de HARBOR_PERMITIDOS (entrypoint.sh).
# =============================================================================
worker_processes 1;
pid /tmp/nginx.pid;
# crit: as recusas (allow/deny, limit_conn) logam em "error" com o IP COMPLETO do cliente. O access log abaixo já registra
# cada sessão com o IP anonimizado e o status (403 = fora da lista, 503 = limite de conexões).
error_log /dev/stderr crit;

events {
    worker_connections 128;
}

stream {
    # IP anonimizado (S-B04), como o nginx do web: /24 no IPv4, /64 no IPv6.
    map $remote_addr $remote_addr_anon {
        default                                   0.0.0.0;
        "~^(?<ip>\d+\.\d+\.\d+)\.\d+$"            "${ip}.0/24";
        "~^(?<ip6>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):" "${ip6}::/64";
    }

    log_format sessao_anon '$time_iso8601 $remote_addr_anon $status $session_time $bytes_received';
    access_log /dev/stdout sessao_anon;

    # Resolvido a cada conexão: o proxy sobe mesmo com o Liquidsoap fora, e acompanha a troca de IP do contêiner.
    resolver 127.0.0.11 valid=10s ipv6=off;
    map "" $liquidsoap {
        default liquidsoap:8005;
    }

    # Um locutor por vez no ar; 2 conexões por IP deixam a reconexão do BUTT entrar antes de a antiga cair.
    limit_conn_zone $binary_remote_addr zone=por_ip:1m;

    server {
        listen 8005;

        include /tmp/harbor-borda/permitidos.conf;

        limit_conn por_ip 2;
        proxy_connect_timeout 5s;
        # O source client manda áudio sem parar: 30 s sem nenhum byte é conexão morta.
        proxy_timeout 30s;
        proxy_pass $liquidsoap;
    }
}
