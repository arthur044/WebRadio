# Incluído em TODO location (add_header não é herdado por um location filho que já
# define o seu próprio add_header — S-M14). CSP baseada no S-M14, com 2 ajustes da
# revisão do Sentinel: sem 'unsafe-inline' em style-src (build não gera <style>/
# style="" inline); connect-src só 'self' (mesma origem já cobre o WebSocket do hub,
# um "wss:" genérico permitiria conexão a QUALQUER host); sem upgrade-insecure-
# requests (quebraria acesso HTTP puro fora de localhost — só faz sentido com TLS).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HSTS só com TLS (S-M14). Este container serve HTTP puro em :8080 no Épico 1 — quem
# termina TLS na frente (fora de escopo aqui) é quem deve acrescentar o header.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
