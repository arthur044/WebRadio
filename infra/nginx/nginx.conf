worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Slowloris (S-M13): conexão lenta de header/body não segura um worker por muito tempo.
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;

    # IP anonimizado nos logs (S-B04): zera o último octeto IPv4 / mantém só /64 em IPv6.
    map $remote_addr $remote_addr_anon {
        default                                   0.0.0.0;
        "~^(?<ip>\d+\.\d+\.\d+)\.\d+$"            "${ip}.0";
        "~^(?<ip6>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):" "${ip6}::";
    }

    log_format access_anon
        '$remote_addr_anon - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent"';

    # Sem query string (S-M09, S-B04): /hubs/ carrega access_token e listenerId;
    # /storage/ carrega a assinatura da URL pré-assinada (X-Amz-Signature etc.).
    log_format anon_sem_query
        '$remote_addr_anon - [$time_local] '
        '"$request_method $uri $server_protocol" $status $body_bytes_sent';

    access_log /dev/stdout access_anon;

    # DNS embutido do Docker: resolve api/icecast/minio em tempo de execução (não na
    # carga da config), para o nginx subir e continuar servindo a SPA mesmo que um
    # desses serviços esteja temporariamente fora do ar (ver comentário nos locations).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Upgrade de WebSocket para o hub SignalR.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Allowlist pra /storage/midia/ (revisão do Sentinel — denylist de parâmetros de
    # listagem trocada por permitir só o que parece uma URL pré-assinada de verdade).
    # $arg_X-Amz-Signature não existe (hífen não é válido em nome de variável nginx),
    # por isso o match é sobre $args inteiro.
    map $args $has_amz_signature {
        default 0;
        "~(^|&)X-Amz-Signature=" 1;
    }

    # Rate limiting na borda (S-M13) — o .NET RateLimiter continua valendo atrás disso.
    limit_req_zone $binary_remote_addr zone=api_geral:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_stream:10m;
    limit_conn_zone $binary_remote_addr zone=conn_hubs:10m;
    limit_req_status 429;
    limit_conn_status 429;

    include /etc/nginx/conf.d/*.conf;
}
