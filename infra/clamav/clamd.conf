# E4-F06 (E4-D7) — clamd do WebRadio: só TCP na rede `antivirus` (3310), sem socket unix, log só em stderr (sem arquivo), banco só leitura.
# O Worker fala INSTREAM por esta porta; ninguém mais alcança o clamd (a rede `antivirus` só tem o worker e ele).
Foreground yes
LogTime yes
LogVerbose no
User clamav
DatabaseDirectory /var/lib/clamav
PidFile /tmp/clamd.pid
TCPSocket 3310
TCPAddr 0.0.0.0
# O limite de upload da mídia é de 250 MiB (música); o clamd precisa aceitar um pouco mais que isso no INSTREAM e no scan.
StreamMaxLength 260M
MaxFileSize 260M
MaxScanSize 260M
MaxThreads 2
# O freshclam roda em OUTRO contêiner e não consegue mandar o NotifyClamd: o clamd confere a base sozinho a cada 10 min (SelfCheck).
SelfCheck 600
# A recarga concorrente dobra o pico de memória; desligada, o scan espera a recarga (e, pelo E4-D13, o arquivo só espera também).
ConcurrentDatabaseReload no
