# E4-F06 (E4-D7) — freshclam do WebRadio, em contêiner próprio: baixa as assinaturas para o volume `clamav-db` (que o clamd monta SÓ leitura).
# Único contêiner do Épico 4 com saída à internet (espelhos de assinatura); não tem nenhum dado, segredo nem acesso à rede interna.
Foreground yes
LogTime yes
DatabaseDirectory /var/lib/clamav
DatabaseOwner clamav
DatabaseMirror database.clamav.net
# A cada 2 h (12 por dia): a idade máxima aceita pelo Worker é de 3 dias, com folga para uma queda de espelho.
Checks 12
# Sem NotifyClamd: o clamd está noutro contêiner e se recarrega pelo SelfCheck.
