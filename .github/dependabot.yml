# F17b (05 §9.2): sem isto os SHAs das Actions e as dependências envelhecem sem aviso. Atualizações semanais, agrupadas por
# ecossistema para não abrir um PR por pacote. Os FROM dos Dockerfiles são `imagem:tag@sha256:...` (a tag dá ao Dependabot o que
# comparar; o digest fixa o conteúdo). As imagens do docker-compose.yml são só por digest e o Dependabot só acompanha Dockerfile:
# a troca delas é manual, conferida no PR que a faz (e o job `vulnerabilidades` acusa o envelhecimento).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "nuget"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      nuget:
        patterns: ["*"]
    # MediatR fica no 12.x: a licença passa a RPL/comercial a partir da 13 (decisão do usuário em 19/10/2026).
    # Ver o aviso em backend/Directory.Packages.props.
    ignore:
      - dependency-name: "MediatR"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # typescript-eslint ainda não declara o TypeScript 7 no peer (`npm ci` falha com ERESOLVE no #46): fica no 6.x até ele suportar.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Um bloco por pasta com Dockerfile.
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    ignore:
      # Troca de major da imagem .NET é manual, e só em linha LTS (hoje o 10): o Dependabot proporia o 11 (STS), que também exige
      # mudar o TargetFramework e o global.json. Atualizações de minor e patch continuam automáticas. O nome da dependência
      # varia com o registry; os dois padrões cobrem mcr.microsoft.com/dotnet/{sdk,aspnet,runtime}.
      - dependency-name: "mcr.microsoft.com/dotnet/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    ignore:
      # Troca de major do Node é manual, e só em linha LTS (hoje o 22; o 26 do #45 não é LTS): o runtime, o @types/node do
      # package.json e o CI precisam andar juntos (Guardian B2 do #45).
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/infra/icecast"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/infra/minio"
    schedule:
      interval: "weekly"
