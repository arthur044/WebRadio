# =============================================================================
# WebRadio — docker-compose.live.yml (E2-F11) · uso EXPLÍCITO, nunca override automático (S-M12):
#   docker compose -f docker-compose.yml -f docker-compose.live.yml up -d --wait
#
# Liga o ao vivo em produção: publica a porta do harbor-borda SÓ no IP do .env (HARBOR_BIND_IP: a interface da VPN ou do
# estúdio; nunca 0.0.0.0) e põe a API em Harbor__AtrasDoProxy=true (o Liquidsoap só vê o IP do proxy: a API não bloqueia
# por IP nem por par, só registra e alerta; o nginx limita as conexões simultâneas por IP, não a taxa de tentativas: risco aceito 3 do 05 §4). HARBOR_PERMITIDOS é obrigatório aqui.
# =============================================================================
services:
  harbor-borda:
    environment:
      HARBOR_PERMITIDOS: "${HARBOR_PERMITIDOS:?Defina HARBOR_PERMITIDOS no .env (IPs ou redes CIDR dos locutores, ex.: a VPN)}"
      # Só para o entrypoint recusar a subida com 0.0.0.0 ou :: (e com lista /0): "nunca 0.0.0.0" é imposto, não só pedido.
      HARBOR_BIND_IP: "${HARBOR_BIND_IP:?Defina HARBOR_BIND_IP no .env (o IP da interface da VPN ou do estúdio; nunca 0.0.0.0)}"
    ports:
      - "${HARBOR_BIND_IP:?Defina HARBOR_BIND_IP no .env (o IP da interface da VPN ou do estúdio; nunca 0.0.0.0)}:${HARBOR_PORT:-8005}:8005"

  api:
    environment:
      Harbor__AtrasDoProxy: "true"
      # O que o locutor digita no BUTT/Mixxx (campo `conexao` da credencial de transmissão, 06): o nome público do harbor, ou o
      # próprio HARBOR_BIND_IP se HARBOR_HOST_PUBLICO não for definido, e a mesma porta publicada acima.
      Harbor__HostPublico: "${HARBOR_HOST_PUBLICO:-${HARBOR_BIND_IP}}"
      Harbor__PortaPublica: "${HARBOR_PORT:-8005}"
